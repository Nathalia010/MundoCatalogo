<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta los catálogos en PDF y recorre sus páginas.">
  <title>Mundo Catálogo</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell header-content d-flex flex-wrap align-items-center justify-content-between">
      <a href="/" class="brand d-flex align-items-center" aria-label="Inicio de Mundo Catálogo"><span class="brand-icon" aria-hidden="true"></span><span class="brand-name">Mundo <span>Catálogo</span></span></a>
      <div class="header-actions d-flex flex-wrap align-items-center justify-content-end">
        <button id="session-button" class="btn button button-text is-guest" type="button">
          <span class="session-icon" aria-hidden="true"></span><span id="session-label" class="visually-hidden">Iniciar sesión</span>
        </button>
        <button id="logout" class="btn button button-text" type="button" hidden>Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main>
    <h1 class="visually-hidden">Mundo Catálogo</h1>
    <section id="admin" class="shell admin" aria-labelledby="admin-heading" hidden>
      <div class="admin-header d-flex flex-wrap justify-content-between">
        <h2 id="admin-heading">Panel de catálogos</h2>
        <button id="add" class="btn button button-primary" type="button">Agregar PDF</button>
      </div>
      <p id="reorder-hint" class="admin-hint" hidden>Arrastra desde los puntos o púlsalos para elegir una posición.</p>
      <ol id="admin-list" class="admin-list"></ol>
      <p id="admin-status" class="admin-status" role="status"></p>
    </section>

    <div id="catalogs" class="shell d-grid" aria-label="Catálogos disponibles">
      <p class="initial-status" role="status">Cargando catálogos…</p>
    </div>
  </main>

  <template id="reader-template">
    <article class="reader">
      <header class="reader-header d-flex justify-content-between align-items-center">
        <h2></h2>
      </header>
      <div class="reader-stage" tabindex="0" role="group" aria-label="Libro digital. Usa las flechas para pasar la hoja y Enter para abrir a pantalla completa.">
        <div class="reader-top-actions">
          <button class="fullscreen-grip" type="button" aria-label="Salir de pantalla completa" title="Desliza hacia abajo para salir"><span aria-hidden="true"></span></button>
          <a class="pdf-link btn button" target="_blank" rel="noopener">Abrir PDF</a>
        </div>
        <button class="turn previous" type="button" aria-label="Página anterior" disabled><span aria-hidden="true"></span></button>
        <div class="page-frame">
          <div class="book" hidden>
            <div class="book-pages"><div class="book-page"></div><div class="book-page"></div></div>
            <div class="book-turn" aria-hidden="true" hidden><div class="book-front"></div><div class="book-back"></div></div>
          </div>
          <img class="reader-cover" alt="" decoding="async" draggable="false" hidden>
          <p class="page-status" role="status">Cargando PDF…</p>
        </div>
        <button class="turn next" type="button" aria-label="Página siguiente" disabled><span aria-hidden="true"></span></button>
        <span class="page-number" role="status" aria-live="polite"></span>
      </div>
    </article>
  </template>

  <dialog id="fullscreen-reader" class="fullscreen-reader" aria-label="Revista a pantalla completa"></dialog>

  <template id="empty-template">
    <section class="empty">
      <div class="empty-art" aria-hidden="true">
        <div class="art-shadow"></div>
        <div class="art-back"></div>
        <div class="art-front"><div class="art-landscape"></div><i></i><i></i><i></i></div>
      </div>
      <h2>Aún no hay catálogos</h2>
      <p id="empty-message">Los catálogos publicados aparecerán aquí.</p>
    </section>
  </template>

  <dialog id="login-dialog" aria-labelledby="login-heading">
    <form id="login-form">
      <div class="dialog-header"><h2 id="login-heading">Iniciar sesión</h2><button class="close" type="button" aria-label="Cerrar">×</button></div>
      <label for="user">Usuario</label>
      <input class="form-control" id="user" name="user" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="form-status" role="status"></p>
      <button class="btn button button-primary" type="submit">Ingresar</button>
    </form>
  </dialog>

  <dialog id="upload-dialog" aria-labelledby="upload-heading">
    <form id="upload-form">
      <div class="dialog-header"><h2 id="upload-heading">Agregar PDF</h2><button class="close" type="button" aria-label="Cerrar">×</button></div>
      <label for="title">Nombre del catálogo</label>
      <input class="form-control" id="title" name="title" maxlength="120" placeholder="Se puede usar el nombre del archivo">
      <label for="file">Archivo PDF</label>
      <input id="file" name="file" type="file" accept=".pdf,application/pdf" aria-describedby="file-hint" data-limit-mb="100" required>
      <p id="file-hint" class="field-hint">Hasta 100 MB.</p>
      <p class="form-status" role="status"></p>
      <button class="btn button button-primary" type="submit">Guardar PDF</button>
    </form>
  </dialog>

  <dialog id="position-dialog" aria-labelledby="position-heading">
    <form id="position-form">
      <div class="dialog-header"><h2 id="position-heading">Mover catálogo</h2><button class="close" type="button" aria-label="Cerrar">×</button></div>
      <p id="position-title"></p>
      <label for="position-select">Nueva posición</label>
      <select class="form-select" id="position-select" required autofocus></select>
      <button class="btn button button-primary" type="submit">Guardar posición</button>
    </form>
  </dialog>
  <dialog id="remove-dialog" aria-labelledby="remove-heading" aria-describedby="remove-description">
    <form id="remove-form">
      <div class="dialog-header"><h2 id="remove-heading">Quitar PDF</h2><button class="close" type="button" aria-label="Cerrar">×</button></div>
      <p id="remove-description"></p>
      <p class="form-status" role="status"></p>
      <div class="dialog-actions">
        <button class="btn button button-outline" id="cancel-remove" type="button" autofocus>Cancelar</button>
        <button class="btn button button-danger" type="submit">Quitar PDF</button>
      </div>
    </form>
  </dialog>
</body>
</html>
